{% extends "base.html" %}
{% block titulo %}Nova senha{% endblock %}
{% block topbar_titulo %}Nova senha{% endblock %}
{% block conteudo %}
<div class="pagina-auth">
  <div class="cartao-auth">
    <h1 style="font-size:1.4rem;"><i class="bi bi-key"></i> Definir nova senha</h1>
    <p style="color:var(--tinta-suave); font-size:0.88rem;">Mínimo 10 caracteres, com letras e números.</p>
    <form method="post" action="{{ url_for('redefinir_senha', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="campo-formulario mb-2"><label for="nova_senha">Nova senha</label>
        <input type="password" class="form-control" id="nova_senha" name="nova_senha" required minlength="10" autocomplete="new-password"></div>
      <div class="campo-formulario mb-3"><label for="confirmar_senha">Confirmar senha</label>
        <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" required minlength="10" autocomplete="new-password"></div>
      <button type="submit" class="btn btn-primary w-100">Guardar</button>
    </form>
  </div>
</div>
{% endblock %}
